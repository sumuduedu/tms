{% extends 'base.html' %}{% block content %}<h2>Submission History</h2><table class="table"><tr><th>Exercise</th><th>Date</th><th>Marks</th><th>Feedback</th></tr>{% for s in object_list %}<tr><td>{{ s.exercise.title }}</td><td>{{ s.submitted_at }}</td><td>{{ s.marks|default:'-' }}</td><td>{{ s.feedback|default:'-' }}</td></tr>{% endfor %}</table>{% endblock %}
