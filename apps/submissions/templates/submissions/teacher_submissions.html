{% extends 'base.html' %}{% block content %}<h2>Student Submissions</h2><table class="table"><tr><th>Exercise</th><th>Student</th><th>File</th><th>Marks</th><th></th></tr>{% for s in object_list %}<tr><td>{{ s.exercise.title }}</td><td>{{ s.student.email }}</td><td><a href="{{ s.submission_file.url }}">Download</a></td><td>{{ s.marks|default:'-' }}</td><td><a href="{% url 'submissions:grade' s.pk %}">Grade</a></td></tr>{% endfor %}</table>{% endblock %}
