{% extends 'base.html' %}{% block content %}<h2>{{ object.title }}</h2><p>{{ object.description }}</p><a href="{{ object.instruction_file.url }}" class="btn btn-primary">Instruction File</a><ul>{% for res in object.resources.all %}<li><a href="{{ res.file.url }}">Resource {{ forloop.counter }}</a></li>{% endfor %}</ul>{% if user.role == 'Student' %}<a class="btn btn-success" href="{% url 'submissions:submit' object.pk %}">Upload Submission</a>{% endif %}{% endblock %}
