{% extends 'base.html' %}{% block content %}
<h3>Available Exercises</h3>
<div class='row g-3'>
{% for ex in object_list %}
<div class='col-md-6 col-xl-4'><div class='card h-100 card-hover'><div class='card-body'>
<h5>{{ ex.title }}</h5><p class='text-muted small'>{{ ex.category }} • Deadline {{ ex.deadline|date:'Y-m-d H:i' }}</p>
<p>{{ ex.description|truncatechars:110 }}</p>
<a href='{% url "exercises:detail" ex.pk %}' class='btn btn-sm btn-outline-primary'>View Details</a>
</div></div></div>
{% endfor %}
</div>{% endblock %}
