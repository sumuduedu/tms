<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete {{ object.title }}</title>
</head>
<body>
  <h1>Delete Course</h1>
  <p>Are you sure you want to delete <strong>{{ object.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'courses:course_detail' object.pk %}">Cancel</a>
  </form>
</body>
</html>
