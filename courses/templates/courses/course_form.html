<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if module_mode %}Add Module{% elif object %}Edit Course{% else %}Create Course{% endif %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 760px; }
    form { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    label { display:block; margin-top: .75rem; font-weight: 600; }
    input, textarea, select { width: 100%; padding: .5rem; margin-top: .25rem; }
    button { margin-top: 1rem; background: #2d6cdf; color: white; border: none; padding: .55rem 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>{% if module_mode %}Add Module to {{ course.title }}{% elif object %}Update Course{% else %}Create Course{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
</body>
</html>
