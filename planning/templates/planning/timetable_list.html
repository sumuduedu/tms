<h1>Timetable - {{ batch }}</h1>
<table>
  <thead>
    <tr><th>Date</th><th>Start</th><th>End</th><th>Topic</th><th>Status</th></tr>
  </thead>
  <tbody>
    {% for item in timetable_entries %}
    <tr>
      <td>{{ item.date }}</td>
      <td>{{ item.start_time }}</td>
      <td>{{ item.end_time }}</td>
      <td>{{ item.topic }}</td>
      <td>{{ item.get_status_display }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No sessions planned.</td></tr>
    {% endfor %}
  </tbody>
</table>
