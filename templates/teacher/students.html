{% extends 'base.html' %}{% block content %}<h3>Students</h3><table class='table table-striped'><tr><th>Name</th><th>Email</th><th>Total Submissions</th><th>Reviewed</th></tr>{% for s in students %}<tr><td>{{ s.student__first_name }} {{ s.student__last_name }}</td><td>{{ s.student__email }}</td><td>{{ s.total_submissions }}</td><td>{{ s.reviewed }}</td></tr>{% endfor %}</table>{% endblock %}
