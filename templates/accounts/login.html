<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TMS</title>
</head>
<body>
  <main>
    <h1>Training Management System</h1>
    <h2>Sign in</h2>

    {% if form.errors %}
      <p style="color: red;">Invalid email or password.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>
  </main>
</body>
</html>
