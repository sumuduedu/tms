<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT Exercise Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid"><a class="navbar-brand" href="/">ICT EMS</a>
  <div class="ms-auto">{% if user.is_authenticated %}<a class="btn btn-sm btn-light" href="{% url 'accounts:logout' %}">Logout</a>{% endif %}</div></div>
</nav>
<div class="container-fluid"><div class="row">
  {% if user.is_authenticated %}<aside class="col-md-2 bg-white border-end min-vh-100 p-3">
    <a class="d-block mb-2" href="{% url 'dashboard:dashboard' %}">Dashboard</a>
    <a class="d-block mb-2" href="{% url 'exercises:list' %}">Exercises</a>
    {% if user.role == 'Teacher' %}<a class="d-block mb-2" href="{% url 'exercises:manage' %}">Manage Exercises</a><a class="d-block mb-2" href="{% url 'submissions:teacher-list' %}">Submissions</a>{% else %}<a class="d-block mb-2" href="{% url 'submissions:history' %}">My Submissions</a>{% endif %}
  </aside>{% endif %}
  <main class="{% if user.is_authenticated %}col-md-10{% else %}col-12{% endif %} p-4">{% block content %}{% endblock %}</main>
</div></div>
</body>
</html>
